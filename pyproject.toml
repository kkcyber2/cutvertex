[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutvertex"
version = "0.1.0"
description = "Precondition-aware attack path analysis and remediation chokepoint ranking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "kk", email = "kkdev9715@users.noreply.github.com" }]
keywords = ["security", "attack-path", "exposure-management", "ssvc", "epss"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.27,<1.0",
  "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
cutvertex = "cutvertex.cli:main"

[tool.setuptools.packages.find]
include = ["cutvertex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# These files define the attacker-capability vocabulary and the report's
# embedded JavaScript template. Tokens like "secret:read" and
# "cred:oauth-token" are capability identifiers, not credentials, so the
# hardcoded-password rule is a false positive here.
"cutvertex/model.py" = ["S105", "S106"]
"cutvertex/report_html.py" = ["E501"]
"tests/*" = ["S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B105"]
